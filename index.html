<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Claw Machine 🧸</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="room">

        <!-- =================== ARCADE CLAW MACHINE =================== -->
        <div class="machine">

            <!-- 1. MARQUEE / TOP SIGN -->
            <div class="marquee">
                <div class="led-row" aria-hidden="true">
                    <span class="led d1"></span><span class="led d2"></span><span class="led d3"></span>
                    <span class="led d4"></span><span class="led d1"></span><span class="led d2"></span>
                    <span class="led d3"></span><span class="led d4"></span><span class="led d1"></span>
                    <span class="led d2"></span><span class="led d3"></span><span class="led d4"></span>
                    <span class="led d1"></span><span class="led d2"></span>
                </div>
                <div class="sign-title">🧸 <span>LOVE CLAW</span> 🎯</div>
                <div class="sign-sub">အရုပ်ကောက် MACHINE</div>
                <div class="led-row led-bottom" aria-hidden="true">
                    <span class="led d3"></span><span class="led d4"></span><span class="led d1"></span>
                    <span class="led d2"></span><span class="led d3"></span><span class="led d4"></span>
                    <span class="led d1"></span><span class="led d2"></span><span class="led d3"></span>
                    <span class="led d4"></span><span class="led d1"></span><span class="led d2"></span>
                    <span class="led d3"></span><span class="led d4"></span>
                </div>
            </div>

            <!-- 2. GLASS SHOWCASE -->
            <div class="glass-window">
<!-- Top roof rail where the claw trolley rides -->
                <div class="roof-rail">
                    <div class="rail-shine"></div>
                </div>

                <!-- Claw assembly: carriage + cable + 3-finger claw -->
                <div class="claw-assembly" id="clawAssembly">
                    <div class="carriage" aria-hidden="true">
                        <span class="carriage-wheel left"></span>
                        <span class="carriage-wheel right"></span>
                        <span class="carriage-pulley"></span>
                    </div>

                    <div class="rope" id="rope">
                        <span class="rope-core"></span>
                        <span class="rope-sheen"></span>
                    </div>

                    <svg class="claw" id="clawSvg" viewBox="0 0 72 78" width="58" height="64" aria-hidden="true">
                        <defs>
                            <linearGradient id="clawMetal" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#f0f3f6"/>
                                <stop offset=".35" stop-color="#aeb6c0"/>
                                <stop offset=".7" stop-color="#6d7682"/>
                                <stop offset="1" stop-color="#3a424c"/>
                            </linearGradient>
                            <linearGradient id="clawDark" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0" stop-color="#5b6470"/>
                                <stop offset="1" stop-color="#232830"/>
                            </linearGradient>
                            <linearGradient id="clawTip" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0" stop-color="#d7dde4"/>
                                <stop offset="1" stop-color="#4b545e"/>
                            </linearGradient>
                            <filter id="clawShadow" x="-20%" y="-10%" width="140%" height="140%">
                                <feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#000" flood-opacity=".35"/>
                            </filter>
                        </defs>

                        <!-- cable socket -->
                        <rect x="30" y="0" width="12" height="8" rx="2" fill="url(#clawDark)"/>
                        <rect x="32" y="1" width="8" height="3" rx="1" fill="#9aa3ae"/>

                        <!-- motor hub / wrist -->
                        <rect x="20" y="7" width="32" height="16" rx="5" fill="url(#clawDark)" filter="url(#clawShadow)"/>
                        <rect x="23" y="10" width="26" height="10" rx="3" fill="#7a8490"/>
                        <circle cx="28" cy="15" r="2.2" fill="#2a3038"/>
                        <circle cx="36" cy="15" r="2.2" fill="#2a3038"/>
                        <circle cx="44" cy="15" r="2.2" fill="#2a3038"/>
                        <circle cx="28" cy="15" r=".7" fill="#c5ccd4"/>
                        <circle cx="36" cy="15" r=".7" fill="#c5ccd4"/>
                        <circle cx="44" cy="15" r=".7" fill="#c5ccd4"/>

                        <!-- left arm -->
                        <g id="armLeft" class="claw-finger">
                            <path d="M24 22 C16 28 10 38 9 50 C8 58 12 64 18 66"
                                  fill="none" stroke="#2f3640" stroke-width="10" stroke-linecap="round"/>
                            <path d="M24 22 C16 28 10 38 9 50 C8 58 12 64 18 66"
                                  fill="none" stroke="url(#clawMetal)" stroke-width="7.5" stroke-linecap="round"/>
                            <circle cx="16" cy="34" r="3.2" fill="#4a5360" stroke="#1f242b" stroke-width="1"/>
                            <circle cx="16" cy="34" r="1.1" fill="#c9d0d8"/>
                            <path d="M18 66 L22 70 L16 72 Z" fill="url(#clawTip)" stroke="#2a3038" stroke-width=".8"/>
                        </g>

                        <!-- middle arm -->
                        <g id="armMid" class="claw-finger">
                            <path d="M36 22 C36 34 36 48 36 60 C36 66 36 70 36 72"
                                  fill="none" stroke="#2f3640" stroke-width="10" stroke-linecap="round"/>
                            <path d="M36 22 C36 34 36 48 36 60 C36 66 36 70 36 72"
                                  fill="none" stroke="url(#clawMetal)" stroke-width="7.5" stroke-linecap="round"/>
                            <circle cx="36" cy="38" r="3.2" fill="#4a5360" stroke="#1f242b" stroke-width="1"/>
                            <circle cx="36" cy="38" r="1.1" fill="#c9d0d8"/>
                            <path d="M36 72 L40 76 L32 76 Z" fill="url(#clawTip)" stroke="#2a3038" stroke-width=".8"/>
                        </g>

                        <!-- right arm -->
                        <g id="armRight" class="claw-finger">
                            <path d="M48 22 C56 28 62 38 63 50 C64 58 60 64 54 66"
                                  fill="none" stroke="#2f3640" stroke-width="10" stroke-linecap="round"/>
                            <path d="M48 22 C56 28 62 38 63 50 C64 58 60 64 54 66"
                                  fill="none" stroke="url(#clawMetal)" stroke-width="7.5" stroke-linecap="round"/>
                            <circle cx="56" cy="34" r="3.2" fill="#4a5360" stroke="#1f242b" stroke-width="1"/>
                            <circle cx="56" cy="34" r="1.1" fill="#c9d0d8"/>
                            <path d="M54 66 L50 70 L56 72 Z" fill="url(#clawTip)" stroke="#2a3038" stroke-width=".8"/>
                        </g>
                    </svg>
                </div>

                <!-- Prize drop chute -->
                <div class="chute">
                    <span class="chute-lips" aria-hidden="true">📥</span>
                    <span class="chute-label">ထွက်ပေါက်</span>
                </div>

                <!-- Toys (rendered as SVG plush toys by script.js) -->
                <div class="toys-container" id="toysContainer"></div>

                <!-- Glass sheen overlay -->
                <div class="glass-shine" aria-hidden="true"></div>
            </div>

            <!-- 3. CONTROL PANEL -->
            <div class="controls">
                <div class="led-strip" aria-hidden="true"></div>

                <div class="coin-slot">
                    <div class="coin-hole"></div>
                    <span class="coin-label">INSERT<br>COIN</span>
                </div>

                <div class="ctrl-credit">
                    <span class="credit-label">CREDIT</span>
                    <span class="credit-value">❤ 1</span>
                </div>

                <button class="btn btn-left" onclick="moveClaw(-20)" title="ဘယ်ဘက် ရွှေ့ရန်">
                    <span class="btn-arrow">◀</span>
                </button>

                <button class="btn btn-grab" onclick="grabToy()" title="အရုပ်ကောက်ရန်">
                    ကောက် 🎯
                </button>

                <button class="btn btn-right" onclick="moveClaw(20)" title="ညာဘက် ရွှေ့ရန်">
                    <span class="btn-arrow">▶</span>
                </button>
            </div>

        </div>

        <!-- Floor glow -->
        <div class="floor-glow" aria-hidden="true"></div>
    </div>
<!-- Prize Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card" id="modalCard">
            <div class="prize-emoji" id="prizeEmoji"></div>
            <h2 id="prizeTitle">Congratulations အရုပ်ရပါပြီ</h2>
            <p id="prizeMessage" hidden></p>
            <button class="close-btn" id="modalButton" onclick="closeModal()">ကျေးဇူးပါ</button>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
